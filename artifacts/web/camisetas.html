<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Camisetas de fútbol | ESCOBAR ÉLITE</title>

        <link rel="stylesheet" href="/src/style.css" />
    </head>

   
<body>
    <div class="encabezado-categoria">
        <!-- ENCABEZADO -->
        <header>
            <div class="logo">
                <img src="/imagenes/logo/Logo.png" alt="ESCOBAR ÉLITE" />
            </div>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="index.html#categorias">Categorías</a>
                <a href="index.html#contacto">Contacto</a>
            </nav>
        </header>

        <!-- BARRA VOLVER AL INICIO -->
        <div class="barra-volver">
            <a href="index.html" class="volver">
                <svg
                    class="icono-volver"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M19 12H5"></path>
                    <path d="M11 18L5 12L11 6"></path>
                </svg>
                <span>Volver al inicio</span>
            </a>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main>


    <section class="seccion">


                <h1 class="titulo-categoria">Camisetas de fútbol</h1>

                <p class="subtitulo">
                    Explora todas nuestras camisetas de clubes y selecciones.
                </p>
                <!-- BUSCADOR -->
                <div class="buscador-categoria">
                    <div class="buscador">
                        <span class="icono-busqueda">⌕</span>

                        <input
                            type="text"
                            placeholder="Buscar en camisetas..."
                            aria-label="Buscar en camisetas"
                        />
                    </div>
                </div>

                <!-- FILTROS -->
                <div class="filtros">
                    <button class="filtro activo">Todas</button>
                    <button class="filtro">Retro</button>
                    <button class="filtro">Clubes</button>
                    <button class="filtro">Selecciones</button>
                </div>

                <!-- PRODUCTOS -->
                <div class="productos"></div>
            </section>
        </main>

        <!-- PIE DE PÁGINA -->
        <footer class="footer-categoria">
            <h3>ESCOBAR ÉLITE</h3>

            <p>Tu pasión por el deporte, tu estilo.</p>

            <div class="footer-categoria-inferior">
                <p>© 2026 ESCOBAR ÉLITE · Todos los derechos reservados</p>
            </div>
        </footer>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
