kind = "web"
previewPath = "/"
title = "Blank Website"
description = "A minimal, intentionally blank website starter with separate HTML, CSS, and JavaScript files for customization."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
