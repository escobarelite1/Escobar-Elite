<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ropa deportiva | ESCOBAR ÉLITE</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="/imagenes/logo/Logo.png" alt="ESCOBAR ÉLITE">
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="index.html#categorias">Categorías</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>

    </header>


    <main>

        <section class="seccion">

            <a href="index.html" class="volver">
                <svg class="icono-volver" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5"></path>
                    <path d="M11 18L5 12L11 6"></path>
                </svg>
                <span>Volver al inicio</span>
            </a>

            <h1 class="titulo-categoria">
                Ropa deportiva
            </h1>

            <p class="subtitulo">
                Explora nuestros conjuntos, shorts, sudaderas y más.
            </p>

            <!-- BUSCADOR -->
            
            <div class="buscador-categoria">

                <div class="buscador">

                    <span class="icono-busqueda">⌕</span>

                    <input
                        type="text"
                        placeholder="Buscar en ropa deportiva..."
                        aria-label="Buscar en ropa deportiva"
                    >

                </div>

            </div>


            <!-- FILTROS -->
            <div class="filtros">

                <button class="filtro activo">
                    Todas
                </button>

                    <button class="filtro">Equipaciones</button>
                </button>

                <button class="filtro">Conjuntos</button>
                </button>

                <button class="filtro deshabilitado" disabled>
                    Camisetas
                </button>

                <button class="filtro deshabilitado" disabled>
                    Pantalonetas
                </button>

                <button class="filtro deshabilitado" disabled>
                    Sudaderas
                </button>

            </div>


            <div class="productos">

            </div>

        </section>

    </main>


    <footer class="footer-categoria">

        <h3>ESCOBAR ÉLITE</h3>

        <p>
            Tu pasión por el deporte, tu estilo.
        </p>

        <div class="footer-categoria-inferior">

            <p>
                © 2026 ESCOBAR ÉLITE · Todos los derechos reservados
            </p>

        </div>

    </footer>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
